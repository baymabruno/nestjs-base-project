services:
  # application container
  node:
    container_name: dota-metrics
    image: dota-metrics
    restart: unless-stopped
    # longer than PM2's kill_timeout, so the app can shut down gracefully
    stop_grace_period: 15s
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
    env_file: .env
    volumes:
      - logs:/var/www/html/logs
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    # resource limits and hardening
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1}'
          memory: ${MEMORY_LIMIT:-1g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - nest_network

  # website (Next.js, web/)
  web:
    container_name: dota-metrics-web
    image: dota-metrics-web
    restart: unless-stopped
    build:
      context: ./web
      dockerfile: ../docker/DockerfileWeb
    environment:
      # the API, through the compose network
      API_URL: http://node:${PORT:-3000}
    ports:
      - ${WEB_PORT:-3002}:3000
    depends_on:
      node:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPU_LIMIT:-1}'
          memory: ${WEB_MEMORY_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - nest_network

  # database (PostgreSQL): reachable only by the application
  postgres:
    container_name: dota-metrics-postgres
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-1}'
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - nest_network

#volumes
volumes:
  logs:
  postgres-data:

#network
networks:
  nest_network:
    driver: bridge
