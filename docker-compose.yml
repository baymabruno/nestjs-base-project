services:
  # application container
  node:
    container_name: nestjs-base-project
    image: nestjs-base-project
    restart: unless-stopped
    # longer than PM2's kill_timeout, so the app can shut down gracefully
    stop_grace_period: 15s
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
    env_file: .env
    volumes:
      - logs:/var/www/html/logs
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    # resource limits and hardening
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1}'
          memory: ${MEMORY_LIMIT:-1g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - nest_network

#volumes
volumes:
  logs:

#network
networks:
  nest_network:
    driver: bridge
