name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Shell scripts
        run: shellcheck setup.sh docker/*.sh

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      # unit and e2e tests; fails when coverage drops below the thresholds
      - name: Tests and coverage
        run: npm run test:cov

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          tags: dota-metrics:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # fails on fixable HIGH or CRITICAL vulnerabilities in the image
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dota-metrics:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # pushes to main publish the image to ghcr.io/<owner>/<repo>
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from package.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
