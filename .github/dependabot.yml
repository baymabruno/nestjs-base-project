version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is not supported yet by @nestjs/swagger and
      # typescript-eslint; review when they add support
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # follows the Node.js major version used to run the app (26, see .nvmrc
      # and the Dockerfiles); update together with the runtime
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # website (web/)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      nextjs:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # stays on Node.js 26; a new major is a deliberate migration (update
      # .nvmrc, engines and @types/node together)
      - dependency-name: node
        update-types: [version-update:semver-major]

  # PostgreSQL image of the docker-compose files
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # a new PostgreSQL major requires migrating the data volume
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
