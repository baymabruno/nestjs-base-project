services:
  # application container
  node:
    container_name: nestjs-base-project
    image: nestjs-base-project-dev
    restart: on-failure
    command: npm run start:pm2-dev
    build:
      context: ./
      dockerfile: ./docker/DockerfileDev
    volumes:
      - ./:/var/www/html/
      - /var/www/html/node_modules
    ports:
      - ${PORT:-3000}:${PORT:-3000}
      - ${DEBUG_PORT:-9229}:9229
    networks:
      - nest_network

#network
networks:
  nest_network:
    driver: bridge
